name: Build Zombie Smash patched APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check original APK exists
        run: |
          test -f com-zynga-zombiesmash.apk || {
            echo 'ERROR: Upload com-zynga-zombiesmash.apk to the repository root first.'
            exit 1
          }

      - name: Download OpenSSL ARMv5TE libraries
        run: |
          set -euo pipefail
          mkdir -p work/lib/armeabi
          curl -fL 'https://raw.githubusercontent.com/jafarfcb10s-hash/Zombie/openssl-build/libssl.so' -o work/lib/armeabi/libssl.so
          curl -fL 'https://raw.githubusercontent.com/jafarfcb10s-hash/Zombie/openssl-build/libcrypto.so' -o work/lib/armeabi/libcrypto.so
          cp work/lib/armeabi/libcrypto.so work/lib/armeabi/libcrypto.so.1.0.0

      - name: Verify native libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils
          for f in work/lib/armeabi/libssl.so work/lib/armeabi/libcrypto.so; do
            file "$f"
            readelf -h "$f" | grep -q 'ELF32'
            readelf -h "$f" | grep -q 'ARM'
            readelf -A "$f" | grep -q 'Tag_CPU_arch: v5TE'
          done
          nm -D --defined-only work/lib/armeabi/libssl.so | grep -q ' SSLv3_server_method$'
          readelf -d work/lib/armeabi/libssl.so | grep -q 'libcrypto.so.1.0.0'
          echo 'OpenSSL libraries passed ARMv5TE and required-symbol checks.'

      - name: Prepare APK
        run: |
          set -euo pipefail
          mkdir -p work/apk
          cp com-zynga-zombiesmash.apk work/unsigned.apk
          # Remove the old signature: any APK modification invalidates it.
          zip -q -d work/unsigned.apk 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/*.SF' 'META-INF/MANIFEST.MF' || true
          # Add native libraries uncompressed under the existing armeabi ABI folder.
          cd work
          zip -q -0 unsigned.apk lib/armeabi/libssl.so lib/armeabi/libcrypto.so lib/armeabi/libcrypto.so.1.0.0

      - name: Install Android build tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools"
          curl -fL 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip' -o "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-sdk/cmdline-tools"
          mv "$RUNNER_TEMP/android-sdk/cmdline-tools/cmdline-tools" "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'build-tools;35.0.0' >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Align and sign APK
        run: |
          set -euo pipefail
          zipalign -f -p 4 work/unsigned.apk work/aligned.apk
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/zombie-debug.keystore" \
            -storepass android -keypass android -alias zombie \
            -dname 'CN=Zombie Smash Patch, OU=Local, O=OpenAI, L=Unknown, ST=Unknown, C=US' \
            -keyalg RSA -keysize 2048 -validity 10000
          apksigner sign --ks "$RUNNER_TEMP/zombie-debug.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --out Zombie-Smash-OpenSSL-patched.apk work/aligned.apk
          apksigner verify --verbose Zombie-Smash-OpenSSL-patched.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-Smash-OpenSSL-patched
          path: Zombie-Smash-OpenSSL-patched.apk
          if-no-files-found: error
