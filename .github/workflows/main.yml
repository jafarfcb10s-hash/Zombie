name: Build OpenSSL for Zombie Smash

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y perl make unzip curl binutils

      - name: Download NDK
        run: |
          curl -L https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip -o ndk.zip
          unzip -q ndk.zip

      - name: Download OpenSSL 1.0.2u
        run: |
          curl -L https://github.com/openssl/openssl/archive/refs/tags/OpenSSL_1_0_2u.tar.gz -o openssl.tar.gz
          mkdir openssl
          tar -xzf openssl.tar.gz -C openssl

      - name: Build ARM libraries
        run: |
          NDK="$GITHUB_WORKSPACE/android-ndk-r16b"
          TOOL="$NDK/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86_64/bin"
          export PATH="$TOOL:$PATH"
          export ANDROID_DEV="$NDK/platforms/android-16/arch-arm"
          export CC=arm-linux-androideabi-gcc
          export AR=arm-linux-androideabi-ar
          export RANLIB=arm-linux-androideabi-ranlib
          export CFLAGS="-march=armv5te -msoft-float -fPIC -O2"

          cd openssl/openssl-OpenSSL_1_0_2u
          ./Configure android shared
          make depend
          make -j2

          mkdir -p "$GITHUB_WORKSPACE/result"
          cp libcrypto.so* "$GITHUB_WORKSPACE/result/"
          cp libssl.so* "$GITHUB_WORKSPACE/result/"

      - name: Check libraries
        run: |
          file result/*
          readelf -Ws result/libssl.so | grep SSLv3_server_method

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: openssl-libraries
          path: result/
