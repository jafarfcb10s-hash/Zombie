name: Build OpenSSL for Zombie Smash

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y perl make unzip curl binutils git

      - name: Download Android NDK r14b
        run: |
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip \
            -o ndk.zip

          unzip -q ndk.zip

      - name: Download OpenSSL 1.0.2u
        run: |
          curl -fL --retry 3 \
            https://github.com/openssl/openssl/archive/refs/tags/OpenSSL_1_0_2u.tar.gz \
            -o openssl.tar.gz

          mkdir openssl
          tar -xzf openssl.tar.gz -C openssl

      - name: Check NDK
        shell: bash
        run: |
          set -e

          NDK="$GITHUB_WORKSPACE/android-ndk-r14b"

          SYSROOT="$NDK/platforms/android-16/arch-arm/usr"

          TOOL="$NDK/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86_64/bin"

          test -f "$SYSROOT/include/stdlib.h"
          test -f "$SYSROOT/include/stdio.h"
          test -x "$TOOL/arm-linux-androideabi-gcc"

          echo "NDK check successful"

      - name: Build ARM libraries
        shell: bash
        run: |
          set -e

          NDK="$GITHUB_WORKSPACE/android-ndk-r14b"

          export ANDROID_DEV="$NDK/platforms/android-16/arch-arm/usr"

          TOOL="$NDK/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86_64/bin"

          export PATH="$TOOL:$PATH"

          export CC=arm-linux-androideabi-gcc
          export AR=arm-linux-androideabi-ar
          export RANLIB=arm-linux-androideabi-ranlib
          export NM=arm-linux-androideabi-nm

          export CFLAG="-fPIC -DOPENSSL_PIC -DOPENSSL_THREADS -D_REENTRANT -DDSO_DLFCN -DHAVE_DLFCN_H -mandroid -march=armv5te -msoft-float -I$ANDROID_DEV/include -B$ANDROID_DEV/lib -O2 -fomit-frame-pointer -Wall"

          cd openssl/openssl-OpenSSL_1_0_2u

          ./Configure android shared

          make depend
          make -j2

          mkdir -p "$GITHUB_WORKSPACE/result"

          cp -L libcrypto.so "$GITHUB_WORKSPACE/result/libcrypto.so"
          cp -L libssl.so "$GITHUB_WORKSPACE/result/libssl.so"

          test -s "$GITHUB_WORKSPACE/result/libcrypto.so"
          test -s "$GITHUB_WORKSPACE/result/libssl.so"

      - name: Verify libraries
        shell: bash
        run: |
          set -e

          file result/libcrypto.so
          file result/libssl.so

          readelf -h result/libcrypto.so
          readelf -h result/libssl.so

          readelf -Ws result/libssl.so | grep -w SSLv3_server_method

          readelf -d result/libssl.so
          readelf -d result/libcrypto.so

      - name: Publish libraries to repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu

          mkdir -p publish

          cp result/libcrypto.so publish/
          cp result/libssl.so publish/

          cd publish

          git init -b openssl-build

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add libcrypto.so libssl.so
          git commit -m "Publish OpenSSL ARM libraries"

          git remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"

          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            push --force origin openssl-build

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: openssl-1.0.2u-armeabi-libs
          path: result/
          if-no-files-found: error
          retention-days: 14
