name: Build OpenSSL for Zombie Smash

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y perl make unzip curl binutils

      - name: Download NDK r16b
        run: |
          curl -fL --retry 3 https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip -o ndk.zip
          unzip -q ndk.zip

      - name: Download OpenSSL 1.0.2u
        run: |
          curl -fL --retry 3 https://github.com/openssl/openssl/archive/refs/tags/OpenSSL_1_0_2u.tar.gz -o openssl.tar.gz
          mkdir openssl
          tar -xzf openssl.tar.gz -C openssl

      - name: Build ARM libraries
        shell: bash
        run: |
          set -euxo pipefail

          NDK="$GITHUB_WORKSPACE/android-ndk-r16b"
          TOOL="$NDK/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86_64/bin"

          export ANDROID_DEV="$NDK/platforms/android-16/arch-arm/usr"

          test -f "$ANDROID_DEV/include/stdlib.h"

          export PATH="$TOOL:$PATH"
          export CC=arm-linux-androideabi-gcc
          export AR=arm-linux-androideabi-ar
          export RANLIB=arm-linux-androideabi-ranlib
          export NM=arm-linux-androideabi-nm

          export CFLAG="-fPIC -DOPENSSL_PIC -DOPENSSL_THREADS -D_REENTRANT -DDSO_DLFCN -DHAVE_DLFCN_H -mandroid -march=
